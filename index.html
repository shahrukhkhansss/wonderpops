<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Wonder Pops</title>

<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-950 text-white h-screen overflow-hidden flex flex-col">

<!-- YELLOW BANNER KEPT SAME - ONLY TEXT ADDED -->
<header class="bg-yellow-400 text-black h-20 md:h-24 text-center flex items-center justify-center">
  
  <h1 class="text-2xl md:text-3xl font-extrabold">
    Wonder Pops – Cinema Style Popcorn at Home
  </h1>

</header>

<main class="flex-grow flex items-center justify-center px-4">

  <div class="flex items-center justify-center max-w-4xl w-full">

    <div class="text-center">
      <img src="product.jpeg"
           alt="Wonder Pops Product"
           class="rounded-2xl shadow-2xl max-h-[55vh] object-contain border-2 border-yellow-400">
    </div>

  </div>

</main>

<section class="grid grid-cols-1 md:grid-cols-2 gap-6 px-10 pb-4 text-center max-w-2xl mx-auto">

<div class="bg-gray-900 p-4 rounded-2xl shadow-xl">
  <h3 class="text-lg font-bold text-yellow-400">Mexican Cheese</h3>
  <p class="text-[10px] text-gray-300">Spicy cheesy punch for bold taste lovers.</p>
</div>

<div class="bg-gray-900 p-4 rounded-2xl shadow-xl">
  <h3 class="text-lg font-bold text-yellow-400">Sour Cream & Onion</h3>
  <p class="text-[10px] text-gray-300">Creamy and tangy gourmet seasoning.</p>
</div>

</section>

<section class="text-center my-4">
  <button onclick="openWhatsApp()"
    class="bg-green-600 hover:bg-green-500 transition-all text-white px-16 py-3 rounded-full text-lg font-semibold shadow-2xl">
    Order Now
  </button>

  <p class="mt-3 text-[10px] text-gray-400">
    Serves 2 | Ready Under 5 Minutes | Contact: 7397765586
  </p>
</section>

<script>

function openWhatsApp() {

  var number = "7397765586";

  var message = encodeURIComponent(
    "Hello, I would like to order Wonder Pops Popcorn Kit. Please share price and payment details."
  );

  var url = "https://wa.me/" + number + "?text=" + message;

  window.open(url, "_blank");
}

</script>

</body>
</html>
